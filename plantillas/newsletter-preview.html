<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Preview — Newsletter · Remite</title>
  <!--
    PÁGINA VISOR (no es el email).
    Envuelve la plantilla newsletter.html en un iframe, le añade una
    barra para volver y un botón "Ver el código" que abre un modal
    para copiar el HTML de la plantilla. El email de verdad
    (newsletter.html) queda limpio: este archivo no forma parte de él.

    El estilo y la lógica son compartidos: visor.css y visor.js.
    El atributo data-plantilla del <body> dice qué archivo leer.
  -->
  <link rel="stylesheet" href="visor.css">
</head>
<body data-plantilla="newsletter.html">

  <header class="barra">
    <nav class="migas">
      <a href="../index.html#plantillas"><svg class="icono-miga izquierda" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>Plantillas</a>
      <span class="separador">·</span>
      <span class="actual">Newsletter</span>
    </nav>
    <div class="acciones">
      <a class="boton" href="newsletter.html" target="_blank" rel="noopener">Email a pantalla completa<svg class="icono-externo" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4L9 15"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
      <button type="button" class="boton primario" id="boton-ver-codigo">Ver el código &lt;/&gt;</button>
    </div>
  </header>

  <div class="aviso-preview">
    Vista aproximada en el navegador — un cliente de correo real (Gmail, Outlook…) puede mostrarlo distinto.
  </div>

  <main class="lienzo">
    <iframe class="marco-email" src="newsletter.html" title="Plantilla de email: Newsletter"></iframe>
  </main>

  <!-- ============ Modal con el código de la plantilla ============ -->
  <div class="modal-fondo" id="modal-fondo" hidden>
    <div class="modal" role="dialog" aria-label="Código de la plantilla">
      <div class="modal-cabecera">
        <h2>Código de la plantilla</h2>
        <button type="button" class="boton-cerrar" id="boton-cerrar-modal" aria-label="Cerrar">✕</button>
      </div>
      <p class="modal-ayuda">
        Este es el HTML completo del email. Cópialo y pégalo en un archivo
        <code>.html</code> o en tu herramienta de envío.
      </p>
      <div class="modal-acciones">
        <button type="button" class="boton primario" id="boton-copiar">Copiar código</button>
        <span class="aviso-copiado" id="aviso-copiado" hidden>✓ Copiado</span>
      </div>
      <pre class="modal-codigo"><code id="salida-codigo"></code></pre>
    </div>
  </div>

  <script type="module" src="visor.js"></script>
</body>
</html>
