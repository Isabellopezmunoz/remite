    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fondo)"/>
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="19" width="36" height="26" rx="5"/>
